spring.application.name=prueba-turismo-java

# Base de datos en memoria (H2) para poder correr el ejemplo sin instalar nada
spring.datasource.url=jdbc:h2:mem:turismo_db
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Si se quiere usar PostgreSQL igual que en el proyecto de la tesis:
#spring.datasource.url=jdbc:postgresql://localhost:5432/turismo_db
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.jpa.database=postgresql

springdoc.swagger-ui.operationsSorter=method
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/prueba_turismo
server.port=8001
